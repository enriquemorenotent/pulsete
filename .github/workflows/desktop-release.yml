name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  linux-deb:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check Out
        uses: actions/checkout@v6

      - name: Set Up Node
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Install Dependencies
        run: npm ci

      - name: Build Debian Package
        run: npm run dist:linux

      - name: Upload Debian Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pulsete-linux-amd64-deb
          path: release/*.deb

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.deb

      - name: Import APT Signing Key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PULSETE_APT_GPG_PRIVATE_KEY: ${{ secrets.PULSETE_APT_GPG_PRIVATE_KEY }}
          PULSETE_APT_GPG_PASSPHRASE: ${{ secrets.PULSETE_APT_GPG_PASSPHRASE }}
        run: |
          test -n "$PULSETE_APT_GPG_PRIVATE_KEY"
          test -n "$PULSETE_APT_GPG_PASSPHRASE"
          printf '%s' "$PULSETE_APT_GPG_PRIVATE_KEY" | gpg --batch --import
          passphrase_file="$RUNNER_TEMP/pulsete-apt-gpg-passphrase"
          printf '%s' "$PULSETE_APT_GPG_PASSPHRASE" > "$passphrase_file"
          echo "APT_GPG_PASSPHRASE_FILE=$passphrase_file" >> "$GITHUB_ENV"

      - name: Build APT Repository
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APT_GPG_KEY_ID: ${{ secrets.PULSETE_APT_GPG_KEY_ID }}
        run: npm run dist:apt

      - name: Configure Pages
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

      - name: Deploy Pages
        if: startsWith(github.ref, 'refs/tags/')
        id: deployment
        uses: actions/deploy-pages@v5
