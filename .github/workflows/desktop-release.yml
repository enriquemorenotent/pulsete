name: Desktop Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  linux-deb:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: .nvmrc
      - run: npm ci
      - name: Build Candidate Once
        run: npm run dist:linux
      - name: Download Currently Published Baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-checks/baseline.sh
      - name: Verify Installation And Upgrade In Ubuntu Containers
        run: |
          set -euo pipefail
          packages=(release/*.deb)
          test "${#packages[@]}" -eq 1
          bash scripts/release-checks/verify.sh candidate "${packages[0]}" baseline/baseline.deb results
          sha256=$(sha256sum "${packages[0]}" | awk '{print $1}')
          baseline_sha256=$(sha256sum baseline/baseline.deb | awk '{print $1}')
          jq -n --arg commit "$GITHUB_SHA" --arg sha256 "$sha256" \
            --arg baseline_sha256 "$baseline_sha256" --arg baseline "$(cat baseline/tag.txt)" \
            '{commit:$commit, sha256:$sha256, baseline_sha256:$baseline_sha256,
              baseline:$baseline, fresh:"passed", upgrade:"passed"}' > results/verification.json
          echo "Candidate SHA-256: $sha256" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain Test Results Even On Failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-verification
          path: results/
          if-no-files-found: warn
          retention-days: 90
      - name: Retain Tested Package And Baseline
        uses: actions/upload-artifact@v7
        with:
          name: pulsete-linux-amd64-deb
          path: |
            release/*.deb
            baseline/
          if-no-files-found: error
          retention-days: 90
