name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out
        uses: actions/checkout@v6

      - name: Check Release Scripts
        run: |
          shellcheck scripts/release-checks/*.sh
          python3 scripts/release-checks/test-promotion.py

      - name: Set Up Node
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Install Dependencies
        run: npm ci

      - name: Check File Length Limits
        run: npm run lint:file-length

      - name: Build
        run: npm run build

      - name: Build Desktop Runtime
        run: npm run build:electron

      - name: Audit Shipped Dependencies
        run: npm run audit:shipped

      - name: Build Landing Site
        run: npm run build:site

      - name: Test
        run: npm test

      - name: Install Desktop Test Browser
        run: npx playwright install --with-deps chrome

      - name: Test Desktop Browser Flows
        run: npm run test:browser

      - name: Retain Browser Failure Evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-browser-failures
          path: /tmp/pulsete-playwright
          if-no-files-found: ignore
