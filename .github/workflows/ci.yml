name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Set Up Node
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Check File Length Limits
        run: npm run lint:file-length

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
