name: Promote Tested Release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Desktop Release candidate run ID
        required: true
        type: string
      expected_sha256:
        description: SHA-256 of the tested Debian package
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write
  pages: write

concurrency:
  group: release-promotion
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      sha256: ${{ steps.publish.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify And Publish Tested Package
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        shell: bash
        run: bash scripts/release-checks/promote.sh

  publish-apt:
    needs: publish
    uses: ./.github/workflows/pages.yml
    with:
      release_tag: ${{ needs.publish.outputs.tag }}
      expected_sha256: ${{ needs.publish.outputs.sha256 }}
    secrets: inherit

  verify-published:
    needs: [publish, publish-apt]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Download Tested Packages And Published Asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
          EXPECTED_SHA256: ${{ needs.publish.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh run download "$CANDIDATE_RUN_ID" --name pulsete-linux-amd64-deb --dir candidate
          mkdir -p published results
          gh release download "$RELEASE_TAG" --pattern "pulsete_${RELEASE_TAG#v}_amd64.deb" --dir published
          package="published/pulsete_${RELEASE_TAG#v}_amd64.deb"
          echo "$EXPECTED_SHA256  $package" | sha256sum -c - | tee results/github-checksum.log
          bash scripts/release-checks/verify.sh published "$package" candidate/baseline/baseline.deb results
      - name: Retain Published Verification Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-release-verification
          path: results/
          if-no-files-found: warn
          retention-days: 90
