name: Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check Out
        uses: actions/checkout@v6

      - name: Set Up Node
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Install Dependencies
        run: npm ci

      - name: Resolve Published Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          version="${tag#v}"

          if [[ "$tag" != "v$version" || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unexpected release tag: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download Published Debian Package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "pulsete_${RELEASE_VERSION}_amd64.deb" \
            --dir release

          mapfile -t packages < <(find release -maxdepth 1 -type f -name '*.deb' -print)
          test "${#packages[@]}" -eq 1
          test "$(dpkg-deb -f "${packages[0]}" Package)" = "pulsete"
          test "$(dpkg-deb -f "${packages[0]}" Architecture)" = "amd64"
          test "$(dpkg-deb -f "${packages[0]}" Version)" = "$RELEASE_VERSION"

      - name: Import APT Signing Key
        env:
          APT_GPG_KEY_ID: ${{ secrets.PULSETE_APT_GPG_KEY_ID }}
          PULSETE_APT_GPG_PRIVATE_KEY: ${{ secrets.PULSETE_APT_GPG_PRIVATE_KEY }}
          PULSETE_APT_GPG_PASSPHRASE: ${{ secrets.PULSETE_APT_GPG_PASSPHRASE }}
        run: |
          test -n "$APT_GPG_KEY_ID"
          test -n "$PULSETE_APT_GPG_PRIVATE_KEY"
          test -n "$PULSETE_APT_GPG_PASSPHRASE"
          printf '%s' "$PULSETE_APT_GPG_PRIVATE_KEY" | gpg --batch --import
          passphrase_file="$RUNNER_TEMP/pulsete-apt-gpg-passphrase"
          (umask 077 && printf '%s' "$PULSETE_APT_GPG_PASSPHRASE" > "$passphrase_file")
          echo "APT_GPG_PASSPHRASE_FILE=$passphrase_file" >> "$GITHUB_ENV"

      - name: Build Pages Site And APT Repository
        env:
          APT_GPG_KEY_ID: ${{ secrets.PULSETE_APT_GPG_KEY_ID }}
          SITE_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm run dist:apt

      - name: Verify Pages Artifact
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          packages="pages/apt/dists/noble/main/binary-amd64/Packages"
          compressed_packages="${packages}.gz"
          release="pages/apt/dists/noble/Release"
          keyring="build-resources/apt/pulsete-archive-keyring.gpg"

          test -s pages/index.html
          test -f pages/.nojekyll
          test -s "$packages"
          test -s "$compressed_packages"
          test -s "$release"
          test -s pages/apt/dists/noble/InRelease
          test -s pages/apt/dists/noble/Release.gpg
          test -s pages/apt/pulsete.sources
          test -s pages/apt/pulsete-archive-keyring.asc
          test -s pages/apt/pulsete-archive-keyring.gpg

          if grep -Fq '{{VERSION}}' pages/index.html; then
            echo "The landing page still contains an unresolved version token." >&2
            exit 1
          fi
          grep -Fq "Pulsete $RELEASE_VERSION" pages/index.html

          gpgv --keyring "$keyring" pages/apt/dists/noble/InRelease
          gpgv --keyring "$keyring" pages/apt/dists/noble/Release.gpg "$release"
          gzip -cd "$compressed_packages" | cmp - "$packages"

          test "$(grep -c '^Package: ' "$packages")" -eq 1
          filename="$(awk '$1 == "Filename:" { print $2 }' "$packages")"
          expected_sha256="$(awk '$1 == "SHA256:" { print $2 }' "$packages")"
          [[ "$filename" == pool/* ]]
          package_path="pages/apt/$filename"
          test -s "$package_path"
          test "$(sha256sum "$package_path" | awk '{ print $1 }')" = "$expected_sha256"
          test "$(dpkg-deb -f "$package_path" Package)" = "pulsete"
          test "$(dpkg-deb -f "$package_path" Architecture)" = "amd64"
          test "$(dpkg-deb -f "$package_path" Version)" = "$RELEASE_VERSION"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
